name: Build Mama APK

on:
  workflow_dispatch:
  push:
    branches: [mama]

env:
  MEDIA3_BRANCH: release-1.11.0-fongmi
  MEDIA3_VERSION: 1.11.0
  MEDIA3_MODULES: common container database datasource datasource-okhttp decoder decoder-ffmpeg effect exoplayer exoplayer-dash exoplayer-hls exoplayer-rtsp exoplayer-smoothstreaming extractor mpvplayer session ui ui-danmaku

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.10 (Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Resolve media3 fork revision
        id: media3
        run: |
          set -euo pipefail
          sha=$(git ls-remote https://github.com/FongMi/media "refs/heads/$MEDIA3_BRANCH" | cut -f1)
          if [ -z "$sha" ]; then
            echo "cannot resolve branch $MEDIA3_BRANCH" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "media3 fork revision: $sha"

      - name: Cache published media3 artifacts
        id: media3-cache
        uses: actions/cache@v4
        with:
          path: media3-repo
          key: media3-repo-${{ steps.media3.outputs.sha }}-${{ env.MEDIA3_VERSION }}-v1

      - name: Publish media3 modules from FongMi fork
        if: steps.media3-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "$MEDIA3_BRANCH" https://github.com/FongMi/media media3-src
          cd media3-src
          chmod +x gradlew
          sed -i 's#gradle-9.1.0-all.zip#gradle-9.1.0-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          sed -i '/ndkVersion = nativeDependencies/d' libraries/decoder_ffmpeg/build.gradle.kts
          sed -i 's/withSourcesJar()//' build-logic/src/main/kotlin/media3.publish.gradle.kts
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("build-logic/src/main/kotlin/androidx/media3/buildlogic/aarTypeWorkaround.kt")
          text = path.read_text(encoding="utf-8")
          text = text.replace("val hasJar =", "var hasJar =", 1)
          text, count = re.subn(
              r'throw IllegalStateException\(\s*"[^"]*is not on the JAR or AAR list[^"]*"\s*\)',
              "hasJar = true",
              text,
          )
          path.write_text(text, encoding="utf-8")
          print("aarTypeWorkaround patched, replacements:", count)
          PY
          tasks=""
          for module in $MEDIA3_MODULES; do
            tasks="$tasks :lib-$module:publishReleasePublicationToMavenRepository"
          done
          echo "publishing:$tasks"
          ./gradlew --no-daemon --parallel --stacktrace -PmavenRepo="$GITHUB_WORKSPACE/media3-repo" $tasks
          expected="$GITHUB_WORKSPACE/media3-repo/androidx/media3/media3-exoplayer/$MEDIA3_VERSION/media3-exoplayer-$MEDIA3_VERSION.aar"
          test -f "$expected"
          du -sh "$GITHUB_WORKSPACE/media3-repo"

      - name: List published media3 artifacts
        run: |
          set -euo pipefail
          find media3-repo -name "*.aar" | sort
          for module in $MEDIA3_MODULES; do
            test -f "media3-repo/androidx/media3/media3-$module/$MEDIA3_VERSION/media3-$module-$MEDIA3_VERSION.aar" || {
              echo "missing artifact: media3-$module" >&2
              exit 1
            }
          done

      - name: Restore keystore and signing config
        env:
          MAMA_STORE_B64: ${{ secrets.MAMA_STORE_B64 }}
          MAMA_STORE_PASS: ${{ secrets.MAMA_STORE_PASS }}
        run: |
          echo "$MAMA_STORE_B64" | base64 -d > "$GITHUB_WORKSPACE/mama.jks"
          cat > "$GITHUB_WORKSPACE/local.properties" <<EOF
          storeFile=../mama.jks
          keyAlias=mama
          storePassword=${MAMA_STORE_PASS}
          keyPassword=${MAMA_STORE_PASS}
          EOF

      - name: Build mobile and leanback release APKs
        run: |
          set -euo pipefail
          chmod +x gradlew
          python --version
          ./gradlew :app:assembleMobileRelease :app:assembleLeanbackRelease --no-daemon --stacktrace
          find app/build/outputs/apk Release -name "*.apk" 2>/dev/null | sort

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mama-apks
          path: |
            app/build/outputs/apk/**/*.apk
            Release/apk/*.apk
          if-no-files-found: error

      - name: Publish APKs to dist branch
        run: |
          set -euo pipefail
          git config user.name "mama-bot"
          git config user.email "mama-bot@users.noreply.github.com"
          mkdir -p dist-apk
          find app/build/outputs/apk Release -name "*.apk" 2>/dev/null -exec cp -f {} dist-apk/ \;
          ls -la dist-apk
          git checkout --orphan dist-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          cp -f dist-apk/*.apk ./
          git add -f ./*.apk
          git commit -m "APKs build ${{ github.run_number }}"
          git push -f origin dist-tmp:dist
